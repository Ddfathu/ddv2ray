name: Build APK with v2rayNG Core

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Download & Setup v2rayNG Core (AAR & Assets)
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs
          mkdir -p app/src/main/assets

          echo "===> Mengambil libv2ray.aar..."
          # Unduh AAR libv2ray resmi yang digunakan oleh v2rayNG
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/v2rayNG/raw/master/V2rayNG/app/libs/libv2ray.aar || true

          # Jika link master di atas kosong, buat fallback dummy AAR atau ambil dari release
          if [ ! -s app/libs/libv2ray.aar ]; then
            echo "Mengambil AAR dari repositori release binary..."
            curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibV2rayLite/releases/latest/download/libv2ray.aar
          fi

          echo "===> Mengambil rules asset (geoip & geosite)..."
          curl -L -o app/src/main/assets/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -L -o app/src/main/assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

          echo "Isi folder app/libs:"
          ls -la app/libs/

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DDV2Ray-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
