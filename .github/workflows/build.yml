name: Build APK with v2rayNG Core

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup v2rayNG Core (Extract JAR & JNI Libs)
        run: |
          mkdir -p app/libs
          mkdir -p app/src/main/jniLibs
          mkdir -p app/src/main/assets
          mkdir -p /tmp/aar_extract

          echo "Mengunduh libv2ray.aar..."
          curl -L -o /tmp/libv2ray.aar https://github.com/2dust/AndroidLibV2rayLite/releases/latest/download/libv2ray.aar

          echo "Mengekstrak classes.jar dan native libs dari AAR..."
          unzip -q /tmp/libv2ray.aar -d /tmp/aar_extract

          # Pindahkan classes.jar menjadi app/libs/libv2ray.jar
          if [ -f "/tmp/aar_extract/classes.jar" ]; then
            cp /tmp/aar_extract/classes.jar app/libs/libv2ray.jar
            echo "[OK] libv2ray.jar siap di app/libs/"
          fi

          # Pindahkan folder lib (.so) ke jniLibs
          if [ -d "/tmp/aar_extract/jni" ]; then
            cp -r /tmp/aar_extract/jni/* app/src/main/jniLibs/
          elif [ -d "/tmp/aar_extract/lib" ]; then
            cp -r /tmp/aar_extract/lib/* app/src/main/jniLibs/
          fi

          echo "Mengunduh assets rules..."
          curl -L -o app/src/main/assets/geoip.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          curl -L -o app/src/main/assets/geosite.dat https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat

          rm -rf /tmp/libv2ray.aar /tmp/aar_extract

          echo "Daftar libs:"
          ls -la app/libs/
          echo "Daftar jniLibs:"
          ls -la app/src/main/jniLibs/

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DDV2Ray-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
